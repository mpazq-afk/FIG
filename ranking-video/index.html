<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranking Top 5 - Premium</title>
    <link rel="stylesheet" href="./style.css?v=15" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="./data.js?v=15"></script>
  </head>
  <body>
    <!-- Contenedor estricto para OBS a 1920x1080 -->
    <div id="obs-container">
      
      <!-- Tabla Principal -->
      <div id="main-view">
        <div class="header" style="display: flex; align-items: center; justify-content: center; gap: 40px;">
          <img src="https://mpazq-afk.github.io/torneoportafolio2026/logos/fig2.png" alt="FEN Investment Group" style="height: 150px;" />
          <div style="text-align: center;">
            <h1 id="title" style="margin-bottom: 5px;">TORNEO PORTAFOLIO 2026</h1>
            <h2 id="subtitle" style="margin-top: 0;">RANKING TOP 5</h2>
          </div>
        </div>
        <div class="ranking-table" id="ranking-container">
          <!-- Las filas se inyectarán aquí dinámicamente -->
        </div>
      </div>

      <!-- Tarjeta de Detalles (Superpuesta) -->
      <div id="details-overlay" class="hidden-overlay">
        <div class="details-card">
          <div class="card-glow"></div>
          
          <div class="card-sponsors">
            <img src="https://mpazq-afk.github.io/torneoportafolio2026/logos/fig2.png" alt="FEN Investment Group" style="height: 125px; margin-right: 15px;" />
            <img src="https://mpazq-afk.github.io/torneoportafolio2026/logos/blackrock.png" alt="Blackrock" style="height: 45px;" />
            <img src="https://mpazq-afk.github.io/torneoportafolio2026/logos/itau.png" alt="Itaú" style="height: 55px;" />
          </div>
          
          <div class="card-top-bar">
            <div class="card-title-area">
              <h3 class="card-team-name" id="card-team">Nombre Equipo</h3>
              <div class="card-quote" id="card-quote">"Frase inspiradora"</div>
            </div>
            
            <div class="card-financials-tr">
              <div class="fin-box-tr">
                <div class="fin-label-tr">Puntaje</div>
                <div class="fin-value-tr" id="card-score">0.00</div>
              </div>
              <div class="fin-box-tr">
                <div class="fin-label-tr">Retorno</div>
                <div class="fin-value-tr return-positive" id="card-return">+0.00%</div>
              </div>
            </div>
          </div>

          <div class="card-body">
            <div class="card-left-col">
              <div class="card-members" id="card-members">
                <!-- Miembros dinámicos -->
              </div>
            </div>
            <div class="card-right-col">
              <div class="mini-chart-card">
                <div class="mini-chart-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                  <h4 style="font-size: 14px; font-weight: 600; color: #0A0B0D; margin: 0;">Evolución del Retorno</h4>
                  <div id="chart-badge" style="background: rgba(9,133,81,0.1); color: #098551; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700;">+0.00%</div>
                </div>
                <div class="chart-container" style="position: relative; width: 100%; height: 120px;">
                  <canvas id="team-chart"></canvas>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Panel de control oculto para grabación -->
    <div id="control-panel" class="hidden">
      <h3>Panel de Control (OBS)</h3>
      <div class="controls">
        <button id="btn-play">Play</button>
        <button id="btn-pause">Pause</button>
        <button id="btn-reset">Reset</button>
      </div>
      <div class="speed-control">
        <label for="speed">Velocidad: <span id="speed-val">1x</span></label>
        <input type="range" id="speed" min="0.5" max="2" step="0.25" value="1" />
      </div>
      <p class="hint">Presiona 'H' para ocultar/mostrar este panel</p>
    </div>

    <script src="./main.js?v=15"></script>
  </body>
</html>
