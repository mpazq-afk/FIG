<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranking Top 5 - Premium</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="./data.js"></script>
  </head>
  <body>
    <!-- Contenedor estricto para OBS a 1920x1080 -->
    <div id="obs-container">
      
      <!-- Tabla Principal -->
      <div id="main-view">
        <div class="header">
          <h1 id="title">TORNEO PORTAFOLIO 2026</h1>
          <h2 id="subtitle">RANKING TOP 5</h2>
        </div>
        <div class="ranking-table" id="ranking-container">
          <!-- Las filas se inyectarán aquí dinámicamente -->
        </div>
      </div>

      <!-- Tarjeta de Detalles (Superpuesta) -->
      <div id="details-overlay" class="hidden-overlay">
        <div class="details-card">
          <div class="card-glow"></div>
          
          <div class="card-stats-header">
            <div class="card-podium" id="card-podium">#1</div>
            <h3 class="card-team-name" id="card-team">Nombre Equipo</h3>
          </div>
          
          <div class="card-financials">
            <div class="fin-box">
              <div class="fin-label">Puntaje Total</div>
              <div class="fin-value" id="card-score">0.00</div>
            </div>
            <div class="fin-box">
              <div class="fin-label">Retorno</div>
              <div class="fin-value" id="card-return">+0.00%</div>
            </div>
          </div>

          <div class="card-quote" id="card-quote">"Frase inspiradora"</div>
          <div class="card-members" id="card-members">
            <!-- Miembros dinámicos -->
          </div>
        </div>
      </div>

    </div>

    <!-- Panel de control oculto para grabación -->
    <div id="control-panel" class="hidden">
      <h3>Panel de Control (OBS)</h3>
      <div class="controls">
        <button id="btn-play">Play</button>
        <button id="btn-pause">Pause</button>
        <button id="btn-reset">Reset</button>
      </div>
      <div class="speed-control">
        <label for="speed">Velocidad: <span id="speed-val">1x</span></label>
        <input type="range" id="speed" min="0.5" max="2" step="0.25" value="1" />
      </div>
      <p class="hint">Presiona 'H' para ocultar/mostrar este panel</p>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
